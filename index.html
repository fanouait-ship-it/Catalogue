<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf5;--ink:#161b33;--mute:#5d6685;--line:#c9d0e2;--card:#f7f9fd;--accent:#d6336c}
@media(prefers-color-scheme:dark){:root{--bg:#10142a;--ink:#e8ebf8;--mute:#98a1c4;--line:#2a3157;--card:#171c3a;--accent:#ff6b9d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:clamp(34px,7vw,64px);font-weight:800;letter-spacing:-.03em;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tabs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.tabs button{border:0;background:transparent;padding:9px 16px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
input{flex:1;min-width:160px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--line)}
.item div{padding:8px 10px 10px}
.item b{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item small{color:var(--mute)}
.score{color:var(--accent);font-weight:600}
.pager{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:24px}
.pager button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.empty{padding:40px 0;color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>Catalogue</h1>
  <p class="sub" id="sub">Chargement des données…</p>
  <div class="bar">
    <div class="tabs">
      <button id="tA" aria-pressed="true">Anime</button>
      <button id="tM" aria-pressed="false">Manga</button>
    </div>
    <input id="q" type="search" placeholder="Rechercher un titre" aria-label="Rechercher un titre">
    <select id="genre" aria-label="Genre"><option value="">Tous les genres</option></select>
    <select id="sort" aria-label="Tri">
      <option value="popularity">Popularité</option>
      <option value="averageScore">Note</option>
      <option value="seasonYear">Année</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
  <div class="pager">
    <button id="prev">Précédent</button><span id="pg"></span><button id="next">Suivant</button>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
let type="ANIME",page=1,pages=1,timer;
async function load(){
  const p=new URLSearchParams({type,page,q:$("q").value,genre:$("genre").value,sort:$("sort").value});
  const d=await(await fetch("/api/catalogue?"+p)).json();
  pages=d.pages||1;
  $("sub").textContent=`${d.counts.ANIME.toLocaleString("fr")} anime · ${d.counts.MANGA.toLocaleString("fr")} manga — ${d.total.toLocaleString("fr")} résultat(s)`;
  $("grid").innerHTML=d.items.length?d.items.map(m=>{
    const t=m.title.english||m.title.romaji||m.title.native||"";
    const n=type==="ANIME"?(m.episodes?m.episodes+" ép.":""):(m.chapters?m.chapters+" ch.":"");
    return `<article class="item"><img loading="lazy" src="${m.coverImage?.medium||""}" alt=""><div><b>${(t||"").replace(/</g,"&lt;")}</b><small>${[m.format,m.seasonYear,n].filter(Boolean).join(" · ")}</small>${m.averageScore?` <span class="score">${m.averageScore}</span>`:""}</div></article>`}).join(""):
    `<p class="empty">Aucun résultat. Essayez un autre titre ou genre.</p>`;
  $("pg").textContent=`${page} / ${pages}`;
  $("prev").disabled=page<=1;$("next").disabled=page>=pages;
}
function set(t){type=t;page=1;$("tA").setAttribute("aria-pressed",t==="ANIME");$("tM").setAttribute("aria-pressed",t==="MANGA");load()}
$("tA").onclick=()=>set("ANIME");$("tM").onclick=()=>set("MANGA");
$("q").oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{page=1;load()},300)};
$("genre").onchange=$("sort").onchange=()=>{page=1;load()};
$("prev").onclick=()=>{page--;load();scrollTo(0,0)};$("next").onclick=()=>{page++;load();scrollTo(0,0)};
fetch("/api/genres").then(r=>r.json()).then(g=>g.forEach(x=>$("genre").add(new Option(x,x))));
load();
</script>
</body>
</html>
